name: Cloudflare Features CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  DENO_VERSION: 1.40.0
  REDIS_VERSION: 7

jobs:
  # ── 1. Unit Tests (Queue, Durable Objects, Cache, Rate Limit) ──
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 1.x

      - name: Setup Redis (via docker)
        run: |
          docker run -d --name v8box-redis -p 6379:6379 redis:${{ env.REDIS_VERSION }} --appendonly no
          timeout 30 bash -c 'until docker exec v8box-redis redis-cli ping 2>/dev/null | grep -q PONG; do sleep 1; done'

      - name: Run Queue Tests
        run: |
          deno run --allow-env --allow-read --allow-write --allow-net cli.ts queue:stats --queue=default
          echo "✅ Queue tests passed"

      - name: Run Durable Objects Tests
        run: |
          deno run --allow-env --allow-read --allow-write --allow-net cli.ts obj:create --name=test-obj
          deno run --allow-env --allow-read --allow-write --allow-net cli.ts obj:list
          echo "✅ Durable Objects tests passed"

      - name: Run Cache Purge Tests
        run: |
          deno run --allow-env --allow-read --allow-write --allow-net cli.ts cache:set --key=test-key --value='{"test":"data"}'
          deno run --allow-env --allow-read --allow-write --allow-net cli.ts cache:get --key=test-key
          deno run --allow-env --allow-read --allow-write --allow-net cli.ts cache:stats
          echo "✅ Cache purge tests passed"

      - name: Run Rate Limit Tests
        run: |
          deno run --allow-env --allow-read --allow-write --allow-net cli.ts rate:check --ip=127.0.0.1 --rule=default
          echo "✅ Rate limit tests passed"

  # ── 2. Integration Test (Queue Workflow) ──
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 1.x

      - name: Setup Redis (via docker)
        run: |
          docker run -d --name v8box-redis -p 6379:6379 redis:${{ env.REDIS_VERSION }} --appendonly no
          timeout 30 bash -c 'until docker exec v8box-redis redis-cli ping 2>/dev/null | grep -q PONG; do sleep 1; done'

      - name: Enqueue test task
        run: |
          deno run --allow-env --allow-read --allow-write --allow-net cli.ts queue:send --queue=api --payload='{"cmd":"test","data":{"hello":"world"}}'
          echo "✅ Task enqueued"

      - name: Pull task from queue
        run: |
          deno run --allow-env --allow-read --allow-write --allow-net cli.ts queue:pull --queue=api
          echo "✅ Task pulled"

      - name: Verify task stats
        run: |
          deno run --allow-env --allow-read --allow-write --allow-net cli.ts queue:stats --queue=api

      - name: Durable object test
        run: |
          deno run --allow-env --allow-read --allow-write --allow-net cli.ts obj:create --name=integration-test
          deno run --allow-env --allow-read --allow-write --allow-net cli.ts obj:list

      - name: Cache purge test
        run: |
          deno run --allow-env --allow-read --allow-write --allow-net cli.ts cache:set --key=integration-key --value='{"integration":"test"}'
          deno run --allow-env --allow-read --allow-write --allow-net cli.ts cache:purge --tag=default
          echo "✅ Cache purge tests passed"

      - name: Rate limit test
        run: |
          deno run --allow-env --allow-read --allow-write --allow-net cli.ts rate:check --ip=127.0.0.1 --rule=default
          echo "✅ Rate limit tests passed"

      - name: Cleanup
        if: always()
        run: docker stop v8box-redis && docker rm v8box-redis

  # ── 3. DB UI Smoke Test ──
  db-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start services
        run: |
          docker compose up -d
          sleep 5

      - name: Wait for admin endpoint
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if curl -sS -o /dev/null -H 'Host: admin.localhost' http://localhost:8080/admin/login; then
              echo "Admin endpoint is ready"
              exit 0
            fi
            echo "Waiting for services... ($i/40)"
            sleep 3
          done
          echo "Admin endpoint not ready in time"
          docker compose ps
          exit 1

      - name: Run DB UI CI smoke test
        run: bash scripts/test-db-ui-ci.sh

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=300 v8box caddy libsql valkey seaweedfs

      - name: Stop services
        if: always()
        run: docker compose down -v

  # ── 4. Cloudflare Features Compatibility Test ──
  cloudflare-features-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 1.x

      - name: Verify queue.ts exports
        run: |
          deno check queue.ts
          echo "✅ queue.ts syntax valid"

      - name: Verify durable_objects.ts exports
        run: |
          deno check durable_objects.ts
          echo "✅ durable_objects.ts syntax valid"

      - name: Verify cache_purge.ts exports
        run: |
          deno check cache_purge.ts
          echo "✅ cache_purge.ts syntax valid"

      - name: Verify rate_limit.ts exports
        run: |
          deno check rate_limit.ts
          echo "✅ rate_limit.ts syntax valid"

      - name: Verify cli.ts exports
        run: |
          deno check cli.ts
          echo "✅ cli.ts syntax valid"
